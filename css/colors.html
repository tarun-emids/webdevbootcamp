<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS colors</title>

    <style>
        h1{
            color:cadetblue
        }

        .rgb{
            color: rgb(227, 77, 137)
        }

        .rgba{
            color: rgba(227, 77, 137, 0.5)
        }

        .hex{
            color: #FDF000;
        }

        .hexshorthand{
            color: #0f0
        }

        .hsl{
            color: hsl(166, 59%, 30%)
        }
    </style>

</head>
<body>
    
    <h1>CSS Colors</h1>

    <p class="hex">Color with Hex</p>

    <p class="hexshorthand">Color with hexshorthand</p>

    <p class="rgb">Color with RGB</p>

    <p class="rgba">Color with RGBA</p>

    <p class="hsl">Color with HSL</p>

</body>
</html>
