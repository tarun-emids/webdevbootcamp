<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text & Fonts</title>

    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-size: 36px;
        }

        .italic{
            font-style: italic;
        }

        .center{
            text-align: center;
        }

        .spacing{
            line-height: 1.8;
            letter-spacing: 10px;
        }

        a{
            text-decoration: none;
            color: chocolate;
        }
    </style>
</head>
<body>
    
    <h1>CSS Text & Fonts Example</h1>

    <h2>Sub-heading with Uppercase</h2>

    <p>This is a test paragraph in Arial font</p>

    <p class="italic">This is a paragraph in italic text</p>
    <p class="center">This is centered</p>

    <p class="spacing">
        This paragraph has more line height and letter 
        spacing to make it more readable and airy
    </p>

    <a href="#">This is a link with no underline</a>
</body>
</html>
