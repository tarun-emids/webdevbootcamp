<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>

    <style>

        body{
            background-color: #ccc;
            border: solid black;
        }
        .box{
            background-color: lightblue;
            border: 5px double blue;
            padding: 4px;
            margin: 3px;
            text-align: center;
            width: 40%;
        }
    </style>

</head>

<body>

    <h1>CSS Box Model</h1>

    <p class="box">Hello World</p>

    <p>Look at the box above: it has content, padding, border, and margin</p>
    
</body>
</html>
