<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
</head>

<style>
    li{
        list-style: none;
        padding:10px;
        border-bottom: 1px solid#ddd;
    }

    .completed{
        text-decoration: line-through;
        color: #613c00;
    }

    #title{
        background-color: #be8200;
        color: #613c00;
        padding: 10px;
        text-align: center;
    }

    *{
        background-color: beige;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    li span{
        font-weight: bolder;
    }

</style>

<body>
    
    <h1 id="title">My todo list</h1>

    <ul>
        <li><span>Task: </span> Learn HTML& CSS</li>
        <li class = "completed"><span>Task: </span> Finish Homework</li>
        <li><span>Task: </span> Call a friend</li>
        <li class = "completed"><span>Task: </span> Eat dinner</li>
    </ul>

    <p>This is my first note</p>
    <p>This is my second note</p>
    <p>This is my third note</p>

</body>
</html>
