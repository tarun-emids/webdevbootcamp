<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List</title>
</head>
<body>
    <h1>My Day</h1>
    <h2>Today's Plan</h2>
    <ol>
        <li>Morning</li>
            <ul>
                <li>wake up</li>
                <li>Drink Coffee</li>
            </ul>
        <li>Afternoon</li>
            <ol>
                <li>Eat Lunch</li>
                <li>Work on project</li>
            </ol>
        <li>Evening</li>
            <ul>
                <li>Read a book</li>
                <li>Go to sleep</li>
            </ul>
    </ol>
</body>
</html>
